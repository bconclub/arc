<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>ARC · offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0B0C0E; color: #EDEDED; font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { color: #9A9DA3; margin: 0 0 20px; }
  button { background: #CBFA0A; color: #0B0C0E; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
  <main>
    <img src="/pwa-192.png" alt="">
    <h1>You're offline</h1>
    <p>ARC needs a connection. It will pick up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
